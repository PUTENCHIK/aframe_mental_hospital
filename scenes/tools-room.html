<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Кладовка</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <link rel="stylesheet" href="../styles/inventory.css">
    <link rel="stylesheet" href="../styles/notification.css">
</head>

<body>
    <!-- Инвентарь -->
    <div class="ui-overlay">
        <div class="inventory-title">🎒 Инвентарь</div>
        <div class="inventory-items" id="inventory-ui">
            <!-- Слоты инвентаря будут заполняться здесь -->
        </div>
    </div>

    <div class="notification" id="notification">
        Предмет добавлен в инвентарь!
    </div>
    <!-- /Инвентарь -->

    <a-scene fog="type: linear; color: #000000; near: 1; far: 6">

        <a-sky color="#000000"></a-sky>
        <a-entity light="type: ambient; color: #111111; intensity: 0.1"></a-entity>

        <!-- Камера -->
        <a-entity id="cameraRig" position="0 1.6 0">
            <a-entity id="camera" camera look-controls wasd-controls="acceleration:20" reset-on-collision="with: .collision">
                <a-entity id="headLight" light="type: point; color: #ffffff; intensity: 2; distance: 5; decay: 2">
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- Чтобы можно было кликать по предметам! -->
        <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable">
        </a-entity>
        <!-- /Чтобы можно было кликать по предметам! -->

        <!-- Пол -->
        <a-entity position="1.25 0 0">
            <a-plane position="0 0 0" rotation="-90 0 0" width="2" height="2" src="../textures/floor.jpg"
                material="metalness:0; roughness:1"></a-plane>

            <a-plane position="2 0 0" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="-2 0 0" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="0 0 -2" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="2 0 -2" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="-2 0 -2" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="-4 0 -2" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="0 0 -4" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="2 0 -4" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="-2 0 -4" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="-4 0 -4" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="0 0 0" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="2 0 0" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="-2 0 0" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>

            <a-plane position="-4 0 0" rotation="-90 0 0" width="2" height="2" color="#5C4F3B"
                src="../textures/floor.jpg" material="metalness:0; roughness:1"></a-plane>
        </a-entity>

        <!-- Крыша -->
        <a-plane position="0 3.5 -2" rotation="90 0 0" width="8" height="6" color="#5C4F3B" src="../textures/floor.jpg"
        material="metalness:0; roughness:1"></a-plane>

        <!-- Стены -->
        <a-entity>
            <a-box position="-1.75 1.75 1" width="4" height="3.5" depth="0.1" src="../textures/concrete-wall.jpg"
                class="collision"></a-box>
            <a-box position="2.25 1.75 1" width="4" height="3.5" depth="0.1" src="../textures/concrete-wall.jpg"
                class="collision"></a-box>

            <a-box position="-1.75 1.75 -5" width="4" height="3.5" depth="0.1" src="../textures/concrete-wall.jpg"
                class="collision"></a-box>
            <a-box position="2.25 1.75 -5" width="4" height="3.5" depth="0.1" src="../textures/concrete-wall.jpg"
                class="collision"></a-box>

            <a-box position="-3.7 1.75 0" width="4" height="3.5" depth="0.1" src="../textures/concrete-wall.jpg"
                class="collision" rotation="0 90 0"></a-box>
            <a-box position="-3.7 1.75 -4" width="4" height="3.5" depth="0.1" src="../textures/concrete-wall.jpg"
                class="collision" rotation="0 90 0"></a-box>
            
            <a-box position="4 1.75 0" width="4" height="3.5" depth="0.1" src="../textures/concrete-wall.jpg"
                class="collision" rotation="0 90 0"></a-box>
            <a-box position="4 1.75 -4" width="4" height="3.5" depth="0.1" src="../textures/concrete-wall.jpg"
                class="collision" rotation="0 90 0"></a-box>
        </a-entity>

        <!-- Дверь в главный зал -->
         <a-box
            position="0.25 1.4 0.9" 
            width="1.9" 
            height="2.7" 
            depth="0.1"
            id="to-main-hall"
            src="../textures/door.jpg"
            class="clickable collision"
            >
        </a-box>

        <!-- Дверь комнату лечения -->
         <a-box
            position="-3.6 1.4 -2"
            rotation="0 90 0"
            width="1.9" 
            height="2.7" 
            depth="0.1"
            id="to-main-hall"
            src="../textures/door.jpg"
            class="clickable collision"
            >
        </a-box>

        <!-- Полки -->
        <a-entity>
            <!-- Полка -->
            <a-entity
                gltf-model="../models/rack.glb"
                position="-0.7 1.5 -3.6"
                scale="1.7 1.7 1.7"
                rotation="0 0 0"
                class="collision">
            </a-entity>

            <!-- Полка -->
            <a-entity
                gltf-model="../models/rack.glb"
                position="3.6 1.5 -3.6"
                scale="1.7 1.7 1.7"
                rotation="0 0 0"
                class="collision">
            </a-entity>

            <!-- Полка -->
            <a-entity
                gltf-model="../models/rack.glb"
                position="3.6 1.5 -2"
                scale="1.7 1.7 1.7"
                rotation="10 90 0"
                class="collision">
            </a-entity>

            <!-- Полка -->
            <a-entity
                gltf-model="../models/rack.glb"
                position="2.4 1.5 -2.5"
                scale="1.7 1.7 1.7"
                rotation="0 90 0"
                class="collision">
            </a-entity>

            <!-- Полка -->
            <a-entity
                gltf-model="../models/rack.glb"
                position="-1.2 1.5 0.8"
                scale="1.7 1.7 1.7"
                rotation="0 -20 0"
                class="collision">
            </a-entity>
        </a-entity>

        <!-- Вешалка -->
        <a-entity
            gltf-model="../models/hanger.glb"
            position="0 0.1 -4.1"
            scale="1.4 1.4 1.4"
            rotation="0 0 -15"
            class="collision">
        </a-entity>

        <!-- Молоток на полке (ПРЕДМЕТ) -->
        <a-entity
            id="Молоток"
            data-icon="🔨"
            data-name="Молоток"
            class="collectable clickable collision"
            gltf-model="../models/hammer.glb"
            position="2.47 1.6 -3.75"
            scale="1.3 1.3 1.3"
            rotation="-10 -60 0">
        </a-entity>

        <!-- Рамка картины -->
        <a-entity
            gltf-model="../models/picture_frame.glb"
            position="0 1.7 -4.9"
            rotation="0 0 75"
            scale="1.25 1.25 1.25"
            class="collision">
        </a-entity>

        <!-- Рамка картины -->
        <a-entity
            gltf-model="../models/picture_frame.glb"
            position="2 0.8 0.74"
            rotation="-15 180 90"
            scale="1 1 1"
            class="collision">
        </a-entity>

        <!-- Коробки на полках -->
        <a-entity>
            <!-- Коробка -->
            <a-entity
                gltf-model="../models/box1.glb"
                position="-2 0.65 0"
                rotation="0 0 0"
                scale="0.2 0.2 0.2"
                class="collision">
            </a-entity>

            <!-- Коробка -->
            <a-entity
                gltf-model="../models/box1.glb"
                position="-1 1.5 -4"
                rotation="0 30 0"
                scale="0.2 0.2 0.2"
                class="collision">
            </a-entity>

            <!-- Коробка -->
            <a-entity
                gltf-model="../models/box1.glb"
                position="3 1.5 -4"
                rotation="0 68 0"
                scale="0.25 0.25 0.25"
                class="collision">
            </a-entity>

            <!-- Коробка -->
            <a-entity
                gltf-model="../models/box1.glb"
                position="3.6 0.65 -1"
                rotation="0 12 -10"
                scale="0.18 0.18 0.18"
                class="collision">
            </a-entity>

            <!-- Коробка -->
            <a-entity
                gltf-model="../models/box2.glb"
                position="-2 2.57 0"
                rotation="0 60 0"
                scale="0.003 0.003 0.003"
                class="collision">
            </a-entity>

            <!-- Коробка -->
            <a-entity
                gltf-model="../models/box2.glb"
                position="-2.5 0.85 -4"
                rotation="0 14 0"
                scale="0.003 0.003 0.003"
                class="collision">
            </a-entity>

            <!-- Коробка -->
            <a-entity
                gltf-model="../models/box2.glb"
                position="2 1.7 -1"
                rotation="0 -55 0"
                scale="0.003 0.003 0.003"
                class="collision">
            </a-entity>
        </a-entity>

    </a-scene>

    <!-- Скрипт коллизии -->
    <script src="../scripts/reset-on-collision.js"></script>

    <!-- Кодик для инвентаря и интерактивных объектов -->
    <script src="../scripts/inventory.js"></script>
    <script src="../scripts/interactiveThings.js"></script>
    <script src="../scripts/unlockThings.js"></script>
    <script src="../scripts/notifications.js"></script>
    <script>
        let inventorySystem;
        let interactiveThings;
        let notification;
        let unlockThings;

        document.querySelector('a-scene').addEventListener('loaded', function() {
            notification = new Notifications();
            inventorySystem = new InventorySystem(notification);
            interactiveThings = new InteractiveThings(inventorySystem, notification);
            unlockThings = new UnlockThings(inventorySystem, interactiveThings, notification);
        }); 
    </script>
    <!-- /Кодик для инвентаря -->

    <!-- Кодик для локаций -->
    <script src="../scripts/locationController.js"></script>
    <script>
        const locationController = new LocationController("tools-room");
        document.querySelector('a-scene').addEventListener('loaded', function() {
            const camera = document.getElementById("camera");
            
            if (locationController.lastLocation === "healing-room") {
                camera.setAttribute("position", "6.3 0 -4.3")
            }
            else {
                camera.setAttribute("position", "0 0 0")
            }
            locationController.updateLastLocation();
        }); 
    </script>
    <!-- Кодик для локаций -->

    <!-- Переход в главный зал -->
    <script>
        document.getElementById('to-main-hall').addEventListener('click', (event) => {
            window.location.replace("./main-hall.html");
        });
    </script>
</body>

</html>
